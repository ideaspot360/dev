# Site settings
title: IdeaSpot360 Dev
subtitle: Practical Engineering & Cloud Architecture Notes
email: everhashk@gmail.com
description: >-
  In-depth troubleshooting guides, cloud infrastructure post-mortems,
  and production-ready software engineering solutions. No fluff, just working code.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://dev.ideaspot360.com" # the base hostname & protocol for your site
twitter_username: ideaspot360
github_username: ideaspot360

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# SEO and Social
author:
  name: IdeaSpot360 Engineering Notes
  bio: An open technical notebook sharing hands-on post-mortems, kernel-level root causes, and production-ready configs.
  avatar: /assets/images/author.png

# Navigation
header_pages:
  - about.md

# Ads & Analytics (Configurable)
google_analytics: "G-8SMMP0YD5B"
google_adsense_client: "ca-pub-9298402368500516"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

